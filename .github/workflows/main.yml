name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The app's own unit tests. The template tests under scripts/ are known to
      # disagree with this customized app (see AGENTS.md), so they are not gated.
      - name: Unit tests
        run: >-
          node --experimental-strip-types --test
          src/lib/app-data/app-data.test.ts
          src/lib/app-data/readiness-schedule.test.ts
          src/lib/auth/gate-identity.test.ts
          src/lib/auth/sign-in-gate.test.ts
          src/lib/preview-path-prefix.test.ts
          src/lib/portal/security.test.ts
          src/lib/portal/sarah-state.test.ts
          src/lib/portal/zendesk-shape.test.ts
          src/lib/portal/mts-oauth.test.ts
          src/lib/portal/permissions/resolve.test.ts
